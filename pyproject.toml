[project]
name = "drama-interaction"
version = "0.1.0"
description = "短剧即时互动生成工作流 V2：输入一集内容证据，输出位置合适、类型多样、不过度打断观看的即时互动配置"
readme = "README.md"
authors = [
    { name = "zjh", email = "1098653175@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.11,<2.0",
    "pydantic>=2.13.5,<3.0",
    "python-dotenv>=1.2.3,<2.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0",
    "langchain-openai>=1.6.0,<2.0",
    "langchain>=1.4.0",
    "openai>=1.0.0",
    "dashscope>=1.14.0",
    "cos-python-sdk-v5>=1.9.44,<2.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit_tests"]
markers = [
    "integration: 需要真实外部端点，默认跳过（用 --integration 显式触发）",
]
filterwarnings = [
    "ignore::DeprecationWarning:dashscope.*",
]

[tool.ruff]
extend-exclude = ["v1"]
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]
