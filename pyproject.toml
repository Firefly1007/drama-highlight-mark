[project]
name = "drama-interaction"
version = "0.1.0"
description = "短剧即时互动生成工作流 V2：输入一集内容证据，输出位置合适、类型多样、不过度打断观看的即时互动配置"
readme = "README_v2.md"
authors = [
    { name = "zjh", email = "1098653175@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2,<2.0",
    "pydantic>=2.7,<3.0",
    "openai>=1.30,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit_tests"]
markers = [
    "integration: 需要真实 LLM 端点，默认跳过（用 --integration 显式触发）",
]
addopts = "-m 'not integration'"

[tool.ruff]
ignore = ["E501"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
